name: Bug report
description: Something isn't working as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set Animation to Music Sync
        2. Play a song in Spotify
        3. …
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, MacBook Air M3
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Animation mode
      options: [Music Sync, Flow, Steady]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Output of `/usr/bin/log show --last 5m --info --predicate 'subsystem == \"com.openglow.app\"'` around the problem."
      render: text
